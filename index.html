      .no-scrollbar::-webkit-scrollbar {

      /* Animaciones */

      @keyframes modalOut {

    <script>
      const SHEET_URL =
        "https://opensheet.elk.sh/1g0FijswveLKntoF7Nu-i0GksgpN50e607wT_LQ_Z6XQ/menu";

      const KEYS = {
        categoria: "categoria",
        producto: "producto",
        precio: "precio",
        descripcion: "descripcion",
        imagen: "imagen",
        disponible: "disponible",
      };

      // Imagen por defecto genérica
      const DEFAULT_IMAGE = "https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?q=80&w=400&fit=crop";

      // Registro global de productos para el modal
      const allProducts = [];

      // Orden personalizado de categorías (las que no estén van al final)
      const ORDEN_CATEGORIAS = [
        'gin',
        'tragos',
        'cerveza',
        'tragos de autor',
        'jarras',
        'espumantes',
        'empanadas',
        'tequenos',
        'papas fritas',
        'pizzas',
        'hamburguesa',
        'sandwiches',
        'postre'
      ];

      document.addEventListener("DOMContentLoaded", () => {
        cargarMenu();
      });

      // Función para obtener el índice de orden de una categoría
      function obtenerOrdenCategoria(categoria) {
        const catNormalizada = categoria.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const index = ORDEN_CATEGORIAS.findIndex(c => 
          catNormalizada.includes(c) || c.includes(catNormalizada)
        );
        return index === -1 ? 999 : index; // Si no está en la lista, va al final
      }

      async function cargarMenu() {
        try {
          const response = await fetch(SHEET_URL);
          if (!response.ok) throw new Error("Error de red");
          const data = await response.json();

          // Filtrar solo productos disponibles
          const productosDisponibles = data.filter(item => item[KEYS.disponible] === "TRUE");

          // Agrupar productos por categoría
          const categoriasMap = new Map();
          productosDisponibles.forEach(item => {
            const categoria = item[KEYS.categoria]?.trim();
            if (categoria) {
              if (!categoriasMap.has(categoria)) {
                categoriasMap.set(categoria, []);
              }
              categoriasMap.get(categoria).push(item);
            }
          });

          // Ordenar categorías según el orden personalizado
          const categoriasOrdenadas = new Map(
            [...categoriasMap.entries()].sort((a, b) => {
              return obtenerOrdenCategoria(a[0]) - obtenerOrdenCategoria(b[0]);
            })
          );

          // Si no hay categorías, mostrar mensaje
          if (categoriasOrdenadas.size === 0) {
            document.getElementById('initial-loader').innerHTML = `
              <span class="text-brand-muted text-sm">No hay productos disponibles</span>
            `;
            document.getElementById('nav-tabs').innerHTML = `
              <li class="snap-center">
                <span class="whitespace-nowrap px-5 py-2 text-[12px] font-display text-brand-muted">Sin categorías</span>
              </li>
            `;
            return;
          }

          // Remover el loader inicial
          document.getElementById('initial-loader')?.remove();

          // Generar navegación y secciones dinámicamente
          const navContainer = document.getElementById('nav-tabs');
          const menuContainer = document.getElementById('menu-container');
          
          navContainer.innerHTML = '';
          
          let isFirst = true;
          categoriasOrdenadas.forEach((productos, categoria) => {
            const sectionId = generarSectionId(categoria);
            
            // Crear botón de navegación
            const navItem = document.createElement('li');
            navItem.className = 'snap-center';
            navItem.innerHTML = `
              <button onclick="switchTab('${sectionId}', this)" 
                class="nav-btn ${isFirst ? 'active bg-[#fdba74] text-brand-black shadow-glow transform' : 'bg-transparent text-brand-muted hover:text-white hover:bg-white/5'} 
                whitespace-nowrap px-5 py-2 rounded-xl text-[12px] font-bold uppercase tracking-[0.15em] font-display transition-all duration-300">
                ${categoria}
              </button>
            `;
            navContainer.appendChild(navItem);

            // Crear sección del menú
            const section = document.createElement('div');
            section.id = sectionId;
            section.className = `menu-section ${isFirst ? 'grid' : 'hidden'} gap-6`;
            section.innerHTML = `
              <div class="flex items-end justify-between mb-2 px-1">
                <h2 class="font-serif italic text-4xl text-white">${categoria}</h2>
              </div>
            `;
            menuContainer.appendChild(section);

            // Renderizar productos de esta categoría
            productos.forEach(item => renderItem(item, sectionId));

            isFirst = false;
          });

        } catch (error) {
          console.error("Error cargando menú:", error);
          document.getElementById('initial-loader').innerHTML = `
            <span class="text-red-400 text-sm">Error al cargar el menú. Intenta recargar la página.</span>
          `;
        }
      }

      // Genera un ID único para la sección basado en el nombre de la categoría
      function generarSectionId(categoria) {
        return 'tab-' + categoria
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '') // Remover acentos
          .replace(/[^a-z0-9]+/g, '-') // Reemplazar caracteres especiales por guiones
          .replace(/^-|-$/g, ''); // Remover guiones al inicio/final
      }

      function renderItem(item, sectionId) {
        const container = document.getElementById(sectionId);
        if (!container) return;
        
        let cleanPrice = item[KEYS.precio] || "";
        cleanPrice = cleanPrice.replace("$", "").trim();
        const processedUrl = procesarURLImagen(item[KEYS.imagen]);
        const imgSrc = processedUrl ? processedUrl : DEFAULT_IMAGE;

        const idx = allProducts.length;
        allProducts.push({
          name: item[KEYS.producto],
          price: cleanPrice,
          desc: item[KEYS.descripcion] || "",
          imgSrc
        });

        const card = `
            <article class="relative flex items-center gap-4 p-4 rounded-2xl bg-[#121212] border border-white/5 hover:border-brand-orange/30 transition-all duration-300 group fade-up bg-card-gradient overflow-hidden cursor-pointer" onclick="openModal(${idx})" role="button" tabindex="0">
                <div class="w-24 h-24 rounded-lg overflow-hidden flex-shrink-0 relative shadow-lg">
                    <img src="${imgSrc}" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700 ease-out" alt="${item[KEYS.producto]}" loading="lazy" onerror="this.src='${DEFAULT_IMAGE}'">
                </div>
                
                <div class="flex-1 min-w-0 z-10">
                    <div class="flex justify-between items-start gap-3 mb-1.5">
                        <h3 class="font-serif italic text-lg text-white leading-tight group-hover:text-brand-orange transition-colors">
                            ${item[KEYS.producto]}
                        </h3>
                        <span class="font-display font-bold text-lg text-brand-orange whitespace-nowrap">
                            $${cleanPrice}
                        </span>
                    </div>
                    <p class="text-xs text-brand-muted font-light leading-relaxed line-clamp-2">
                        ${item[KEYS.descripcion] || ""}
                    </p>
                </div>
            </article>
            `;
        container.insertAdjacentHTML("beforeend", card);
      }

      function switchTab(sectionId, btn) {
        // 1. Ocultar todas las secciones
        document.querySelectorAll('.menu-section').forEach(sec => {
            sec.classList.add('hidden');
            sec.classList.remove('grid');
        });

        // 2. Mostrar sección activa
        const activeSec = document.getElementById(sectionId);
        if(activeSec) {
            activeSec.classList.remove('hidden');
            activeSec.classList.add('grid');
            // Re-trigger animaciones
            activeSec.querySelectorAll('.fade-up').forEach(el => {
                el.style.animation = 'none';
                el.offsetHeight; 
                el.style.animation = null;
            });
        }

        // 3. Actualizar estados de los botones
        const activeClasses = ['bg-[#fdba74]', 'text-brand-black', 'shadow-glow', 'active', 'transform'];
        const inactiveClasses = ['bg-transparent', 'text-brand-muted', 'hover:text-white', 'hover:bg-white/5'];

        document.querySelectorAll('.nav-btn').forEach(b => {
            b.classList.remove(...activeClasses);
            b.classList.add(...inactiveClasses);
        });

        btn.classList.remove(...inactiveClasses);
        btn.classList.add(...activeClasses);

        // 4. Scroll suave
        const header = document.querySelector('header');
        const headerHeight = header ? header.offsetHeight : 0;
        window.scrollTo({ top: headerHeight * 0.8, behavior: 'smooth' });
        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }

      function procesarURLImagen(url) {
        if (!url) return null;
        if (url.includes("drive.google.com")) {
          const idMatch = url.match(/\/d\/(.*?)(?:\/|$)/);
          if (idMatch && idMatch[1]) {
            return `https://lh3.googleusercontent.com/d/${idMatch[1]}`;
          }
        }
        return url;
      }

      function openModal(idx) {
        const product = allProducts[idx];
        if (!product) return;

        document.getElementById('modal-img').src = product.imgSrc;
        document.getElementById('modal-img').alt = product.name;
        document.getElementById('modal-name').textContent = product.name;
        document.getElementById('modal-price').textContent = '$' + product.price;
        document.getElementById('modal-desc').textContent = product.desc;

        const modal = document.getElementById('product-modal');
        const article = document.getElementById('modal-article');
        const backdrop = document.getElementById('modal-backdrop');

        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';

        // Re-disparar animaciones
        article.classList.remove('modal-enter');
        backdrop.classList.remove('backdrop-enter');
        void article.offsetWidth;
        article.classList.add('modal-enter');
        backdrop.classList.add('backdrop-enter');
      }

      function closeModal() {
        const modal = document.getElementById('product-modal');
        const article = document.getElementById('modal-article');
        const backdrop = document.getElementById('modal-backdrop');

        article.classList.remove('modal-enter');
        backdrop.classList.remove('backdrop-enter');
        article.classList.add('modal-exit');
        backdrop.classList.add('backdrop-exit');

        setTimeout(() => {
          modal.classList.add('hidden');
          article.classList.remove('modal-exit');
          backdrop.classList.remove('backdrop-exit');
          document.body.style.overflow = '';
        }, 250);
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });
    </script>

    <!-- Modal de producto -->
    <div
      id="product-modal"
      class="fixed inset-0 z-50 flex items-center justify-center px-4 hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-name"
    >
      <!-- Backdrop difuminado -->
      <div
        id="modal-backdrop"
        class="absolute inset-0 bg-black/75 backdrop-blur-sm"
        onclick="closeModal()"
      ></div>

      <!-- Contenido del modal -->
      <article
        id="modal-article"
        class="relative z-10 w-full max-w-sm bg-[#121212] rounded-2xl border border-white/10 overflow-hidden shadow-nav flex flex-col max-h-[90dvh]"
      >
        <!-- Botón cerrar -->
        <button
          onclick="closeModal()"
          aria-label="Cerrar"
          class="absolute top-3 right-3 z-20 w-8 h-8 flex items-center justify-center rounded-full bg-black/60 border border-white/10 text-brand-muted hover:text-white hover:border-brand-orange/40 transition-all duration-200"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>

        <!-- Imagen -->
        <div class="relative h-full w-full overflow-hidden flex-shrink-0">
          <img
            id="modal-img"
            src=""  
            alt=""
            class="w-full h-[350px] object-cover"
            loading="lazy"
            onerror="this.src='https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?q=80&w=400&fit=crop'"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-[#121212] via-[#121212]/30 to-transparent"></div>
        </div>

        <!-- Informacion del producto -->
        <div class="px-5 pt-4 pb-7 overflow-y-auto">
          <div class="flex items-start justify-between gap-3 mb-3">
            <h2
              id="modal-name"
              class="font-serif italic text-2xl text-white leading-tight"
            ></h2>
            <span
              id="modal-price"
              class="font-display font-bold text-xl text-brand-orange whitespace-nowrap mt-1"
            ></span>
          </div>
          <p
            id="modal-desc"
            class="text-sm text-brand-muted font-light leading-relaxed"
          ></p>
        </div>

        <!-- Línea decorativa inferior -->
        <div class="h-1 w-full bg-gradient-to-r from-transparent via-brand-orange/40 to-transparent flex-shrink-0"></div>
      </article>
    </div>

  </body>
</html>
